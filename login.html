<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDCS | Login</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://kit.fontawesome.com/234d2d077f.js" crossorigin="anonymous"></script>
    <style>
        .error-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- The animation canvas wrapper -->
    <canvas id="droneCanvas"></canvas>

    <!-- The centered login form layer -->
    <div class="login-wrapper">
    <div class="login-box">
        <h1 id="title">Sign Up</h1>
        <form id="authForm">
            <div class="input-group">
                <div class="input-field" id="nameField">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Name" id="nameInput" required>
                </div>

                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Email" id="emailInput" required>
                </div>

                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" id="passwordInput" required>
                </div>
                <p>Lost your account <a href="#">Click here!</a></p>
                <p id="errorMessage" class="error-msg"></p>
            </div>
            <div class="btn-field">
                <!-- Default active button is submit -->
                <button type="submit" id="signupBtn">Sign up</button>
                <button type="button" class="disable" id="signinBtn">Sign in</button>
            </div>
        </form>
    </div>
    </div>

    <script>
        let authForm = document.getElementById("authForm");
        let signupBtn = document.getElementById("signupBtn");
        let signinBtn = document.getElementById("signinBtn");
        let nameField = document.getElementById("nameField");
        let nameInput = document.getElementById("nameInput");
        let title = document.getElementById("title");
        let errorMessage = document.getElementById("errorMessage");
        
        const backendHost = window.location.hostname || 'localhost';
        const authApiUrl = `http://${backendHost}:8002/api/auth`;

        function clearInputs() {
            document.getElementById('nameInput').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        function clearError() {
            errorMessage.innerText = "";
        }

        async function postAuth(path, body) {
            clearError();

            try {
                const res = await fetch(`${authApiUrl}/${path}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    if (res.status === 400 || res.status === 409) {
                        throw new Error(data.detail || "Email is already registered.");
                    }
                    throw new Error(data.detail || `${path === 'signup' ? 'Signup' : 'Login'} failed`);
                }
                return data;
            } catch (error) {
                if (error instanceof TypeError) {
                    errorMessage.innerText = `Cannot reach ${authApiUrl}. Check server connection.`;
                } else {
                    errorMessage.innerText = error.message;
                }
                return null;
            }
        }

        // Toggle to Sign Up mode
        signupBtn.onclick = function () {
            if (signupBtn.classList.contains('disable')) {
                clearError();
                clearInputs();
                nameField.style.maxHeight = "60px";
                nameInput.setAttribute("required", "true"); // Name is required for Sign Up
                title.innerHTML = "Sign Up";
                signupBtn.classList.remove("disable");
                signinBtn.classList.add("disable");
                
                signupBtn.type = "submit";
                signinBtn.type = "button";
            }
        };

        // Toggle to Sign In mode
        signinBtn.onclick = function () {
            if (signinBtn.classList.contains('disable')) {
                clearError();
                clearInputs();
                nameField.style.maxHeight = "0";
                nameInput.removeAttribute("required"); // Name is NOT required for Sign In
                title.innerHTML = "Sign In";
                signinBtn.classList.remove("disable");
                signupBtn.classList.add("disable");

                signinBtn.type = "submit";
                signupBtn.type = "button";
            }
        };

        // Handle submission (Only triggers if all 'required' fields are filled!)
        authForm.onsubmit = async function (e) {
            e.preventDefault(); // Prevents page reload

            const isSignUp = !signupBtn.classList.contains('disable');
            const endpoint = isSignUp ? 'signup' : 'login';

            const payload = {
                email: document.getElementById('emailInput').value,
                password: document.getElementById('passwordInput').value,
            };

            if (isSignUp) {
                payload.name = document.getElementById('nameInput').value;
            }

            const data = await postAuth(endpoint, payload);

            if (data) {
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('userName', data.user.name);
                window.location.href = 'index.html';
            } else {
                clearInputs(); // Clear input fields on failure
            }
        };

        // Canvas animation logic
        const canvas = document.getElementById('droneCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 80; // Total number of "drones" on screen
        const connectionDistance = 120; // Max pixel distance to draw a line between nodes

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DroneNode {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8; 
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 210, 255, 0.7)';
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new DroneNode());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        const alpha = (1 - distance / connectionDistance) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
