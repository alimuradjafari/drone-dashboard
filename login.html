<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTCSD | Access Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script src="https://kit.fontawesome.com/234d2d077f.js" crossorigin="anonymous"></script>
</head>
<body>
    <canvas id="droneCanvas"></canvas>
    <div class="veil"></div>

    <div class="stage">
        <div class="hero">Drone Fleet Telemetry and Charging Station Dashboard</div>

        <div class="panel-wrap">
            <div class="bracket tl"></div>
            <div class="bracket tr"></div>
            <div class="bracket bl"></div>
            <div class="bracket br"></div>

            <div class="panel">
                <div class="panel-eyebrow">
                    <span>ACCESS Dashboard</span>
                    <span class="blip" id="clock">--:--:--</span>
                </div>

                <h1 id="title">Sign Up</h1>
                <p class="subhead">Authenticate to reach the fleet dashboard interface.</p>

                <div class="mode-switch">
                    <button type="button" id="signupBtn" class="active">CREATE ACCOUNT</button>
                    <button type="button" id="signinBtn">SIGN IN</button>
                </div>

                <form id="authForm">
                    <div class="input-group">
                        <div class="field" id="nameField">
                            <label for="nameInput">OPERATOR NAME</label>
                            <div class="box">
                                <i class="fa-solid fa-user"></i>
                                <input type="text" placeholder="ali" id="nameInput" required>
                            </div>
                        </div>

                        <div class="field">
                            <label for="emailInput">EMAIL</label>
                            <div class="box">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" placeholder="ali@gmial.com" id="emailInput" required>
                            </div>
                        </div>

                        <div class="field">
                            <label for="passwordInput">PASSWORD</label>
                            <div class="box">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" placeholder="••••••••" id="passwordInput" required>
                            </div>
                        </div>
                    </div>

                    <p class="recover">Lost account access? <a href="#">Recover it here</a></p>
                    <p id="errorMessage" class="error-msg"></p>

                    <button type="submit" class="submit-btn" id="submitBtn">CREATE ACCOUNT →</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let authForm = document.getElementById("authForm");
        let signupBtn = document.getElementById("signupBtn");
        let signinBtn = document.getElementById("signinBtn");
        let nameField = document.getElementById("nameField");
        let nameInput = document.getElementById("nameInput");
        let title = document.getElementById("title");
        let errorMessage = document.getElementById("errorMessage");
        let submitBtn = document.getElementById("submitBtn");
        let subhead = document.querySelector(".subhead");

        const backendHost = window.location.hostname || 'localhost';
        const authApiUrl = `http://${backendHost}:8000/api/auth`;

        function clearInputs() {
            document.getElementById('nameInput').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        function clearError() {
            errorMessage.innerText = "";
        }

        async function postAuth(path, body) {
            clearError();

            try {
                const res = await fetch(`${authApiUrl}/${path}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    if (res.status === 400 || res.status === 409) {
                        throw new Error(data.detail || "Email is already registered.");
                    }
                    throw new Error(data.detail || `${path === 'signup' ? 'Signup' : 'Login'} failed`);
                }
                return data;
            } catch (error) {
                if (error instanceof TypeError) {
                    errorMessage.innerText = `Cannot reach ${authApiUrl}. Check server connection.`;
                } else {
                    errorMessage.innerText = error.message;
                }
                return null;
            }
        }

        // Toggle to Sign Up mode
        signupBtn.onclick = function () {
            if (!signupBtn.classList.contains('active')) {
                clearError();
                clearInputs();
                nameField.classList.remove('collapsed');
                nameInput.setAttribute("required", "true");
                title.innerHTML = "Sign Up";
                subhead.innerHTML = "Authenticate to reach the fleet dashboard interface.";
                submitBtn.innerHTML = "CREATE ACCOUNT →";
                signupBtn.classList.add("active");
                signinBtn.classList.remove("active");
            }
        };

        // Toggle to Sign In mode
        signinBtn.onclick = function () {
            if (!signinBtn.classList.contains('active')) {
                clearError();
                clearInputs();
                nameField.classList.add('collapsed');
                nameInput.removeAttribute("required");
                title.innerHTML = "Sign In";
                subhead.innerHTML = "Welcome back, operator. Resume fleet oversight.";
                submitBtn.innerHTML = "SIGN IN →";
                signinBtn.classList.add("active");
                signupBtn.classList.remove("active");
            }
        };

        // Handle submission
        authForm.onsubmit = async function (e) {
            e.preventDefault();

            const isSignUp = signupBtn.classList.contains('active');
            const endpoint = isSignUp ? 'signup' : 'login';

            const payload = {
                email: document.getElementById('emailInput').value,
                password: document.getElementById('passwordInput').value,
            };

            if (isSignUp) {
                payload.name = document.getElementById('nameInput').value;
            }

            const data = await postAuth(endpoint, payload);

            if (data) {
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('userName', data.user.name);
                window.location.href = 'index.html';
            } else {
                clearInputs();
            }
        };

        // Live clock in the panel eyebrow
        function tickClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toTimeString().slice(0, 8);
        }
        tickClock();
        setInterval(tickClock, 1000);

        // Canvas animation logic
        const canvas = document.getElementById('droneCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 80;
        const connectionDistance = 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DroneNode {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 168, 200, 0.55)';
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new DroneNode());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        const alpha = (1 - distance / connectionDistance) * 0.16;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 168, 200, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
